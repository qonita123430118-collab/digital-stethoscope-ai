<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Digital Stethoscope Pro</title>

  <link rel="stylesheet" href="style.css">

  <script src="/socket.io/socket.io.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
  <h2>🩺 StethoScope</h2>

  <button>Monitoring</button>
  <button>History</button>
  <button>Settings</button>
</div>

<div class="main">

  <h1>Live Monitoring</h1>

  <div class="cards">

    <div class="card">
      <h3>Current Signal</h3>
      <p id="current">0</p>
    </div>

    <div class="card">
      <h3>BPM</h3>
      <p id="bpm">0</p>
    </div>

    <div class="card">
      <h3>AI Prediction</h3>
      <p id="prediction">Normal</p>
    </div>

  </div>

  <div class="chart-box">
    <canvas id="waveChart"></canvas>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
